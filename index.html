      }
    }
    .animate-furnace-glow {
      animation: furnaceGlow 4s ease-in-out infinite;
    }

    /* Steel Gradient Sweep */
    @keyframes steelSweep {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animate-steel-sweep {
      background-size: 250% 250%;
      animation: steelSweep 6s ease infinite;
    }

    /* Rising Heat Embers (CSS Particle Simulation) */
    .ember-container {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }
    .ember-particle {
      position: absolute;
      bottom: -10px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7ed 0%, #fbbf24 40%, #ea580c 80%, transparent 100%);
      opacity: 0;
      animation: riseEmber 5s linear infinite;
    }

    @keyframes riseEmber {
      0% {
        transform: translateY(0) translateX(0) scale(0.6);
        opacity: 0;
      }
      15% {
        opacity: 0.9;
      }
      75% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-280px) translateX(var(--drift, 20px)) scale(0.1);
        opacity: 0;
      }
    }

    /* Staggered ember particles */
    .ember-particle:nth-child(1) { left: 12%; width: 4px; height: 4px; animation-duration: 4.2s; animation-delay: 0.2s; --drift: 15px; }
    .ember-particle:nth-child(2) { left: 24%; width: 5px; height: 5px; animation-duration: 5.5s; animation-delay: 1.1s; --drift: -25px; }
    .ember-particle:nth-child(3) { left: 38%; width: 3px; height: 3px; animation-duration: 4.8s; animation-delay: 2.3s; --drift: 30px; }
    .ember-particle:nth-child(4) { left: 52%; width: 6px; height: 6px; animation-duration: 6.2s; animation-delay: 0.7s; --drift: -18px; }
    .ember-particle:nth-child(5) { left: 66%; width: 4px; height: 4px; animation-duration: 4.5s; animation-delay: 1.8s; --drift: 22px; }
    .ember-particle:nth-child(6) { left: 78%; width: 5px; height: 5px; animation-duration: 5.8s; animation-delay: 2.9s; --drift: -12px; }
    .ember-particle:nth-child(7) { left: 88%; width: 3px; height: 3px; animation-duration: 4.0s; animation-delay: 0.4s; --drift: 18px; }
    .ember-particle:nth-child(8) { left: 45%; width: 5px; height: 5px; animation-duration: 5.1s; animation-delay: 3.4s; --drift: -30px; }

    /* Heat Shimmer Wave */
    @keyframes heatShimmer {
      0%, 100% { filter: contrast(105%) brightness(100%); transform: translateY(0); }
      50% { filter: contrast(115%) brightness(108%); transform: translateY(-1px); }
    }
    .heat-shimmer {
      animation: heatShimmer 2.5s ease-in-out infinite;
    }

    /* Accessible focus rings */
    *:focus-visible {
      outline: 2px solid #f97316;
      outline-offset: 2px;
    }

    /* Print styles for Quiz Certificate */

      body * {
        visibility: hidden;
      }
      #certificate-modal, #certificate-modal * {
        visibility: visible;
      }
      #certificate-modal {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
      }
    }

    @media (prefers-reduced-motion: reduce) {

        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

    /**
     * Interactive Temperature-to-Glow Scrubber / Strip
     */
    function InteractiveHeatingStrip({ currentTemp, onTempChange }) {
      const activeColorObj = TEMPERATURE_GLOW_SCALE.reduce((prev, curr) => {
        return Math.abs(curr.temp - currentTemp) < Math.abs(prev.temp - currentTemp) ? curr : prev;
      });

      return (
        <div className="p-4 rounded bg-charcoal-850 border border-steel-800 shadow-inner">
          <div className="flex items-center justify-between mb-2">
            <span className="font-mono text-xs text-steel-400 uppercase tracking-wider flex items-center gap-1.5">
              <Icons.Thermometer /> Steel Blacksmith Radiance Strip
            </span>
            <div className="font-mono text-xs flex items-center gap-2">
              <span className="text-steel-400">Current:</span>
              <span className="font-bold text-base px-2 py-0.5 rounded" style={{ color: activeColorObj.hex, backgroundColor: '#0b0b0d' }}>
                {currentTemp}°C
              </span>
              <span className="text-steel-400 hidden sm:inline">({activeColorObj.label})</span>
            </div>
          </div>

          {/* Color Gradient Track */}
          <div className="relative h-6 rounded overflow-hidden cursor-pointer"
               onClick={(e) => {
                 const rect = e.currentTarget.getBoundingClientRect();
                 const x = Math.max(0, Math.min(rect.width, e.clientX - rect.left));
                 const temp = Math.round(20 + (x / rect.width) * (1200 - 20));
                 if (onTempChange) onTempChange(temp);
               }}>
            <div 
              className="absolute inset-0"
              style={{
                background: 'linear-gradient(to right, #64748b 0%, #7f1d1d 30%, #991b1b 45%, #dc2626 58%, #ea580c 68%, #f97316 75%, #fb923c 82%, #fde047 92%, #fffbeb 100%)'
              }}
            />
            {/* Position Marker */}
            <div 
              className="absolute top-0 bottom-0 w-1 bg-white shadow-lg pointer-events-none transition-all duration-75"
              style={{ left: `${((currentTemp - 20) / (1200 - 20)) * 100}%` }}
            />
          </div>

          <div className="flex justify-between text-[10px] font-mono text-steel-500 mt-1">
            <span>20°C (Cold)</span>
            <span>727°C (A1 Eutectoid)</span>
            <span>912°C (Pure Fe A3)</span>
            <span>1200°C (White Heat)</span>
          </div>
          <p className="text-[11px] text-steel-400 mt-2 font-mono">
            {activeColorObj.desc}
          </p>
        </div>
      );
    }

                    About & Fe-C Reference
                  </h3>
                  <p className="text-xs text-steel-400 mt-2 leading-relaxed">
                    Comprehensive equilibrium phase diagrams, TTT/CCT fundamentals, ASTM standards, an interactive 16-term metallurgy glossary, and simulator extension guide.
                  </p>
                </div>
                <div className="mt-4 pt-3 border-t border-steel-800 flex items-center text-xs font-mono text-furnace-amber">
                  Open Reference Library <Icons.ArrowRight />
                </div>
              </a>

            </div>
          </section>
        </div>
      );
    }

    /**
     * PAGE 2: SIMULATOR (#/simulator)
     */
    function SimulatorPage() {
      // Simulator State Controls
      const [carbon, setCarbon] = React.useState(0.45); // wt% C
      const [austTemp, setAustTemp] = React.useState(850); // °C
      const [soakTime, setSoakTime] = React.useState(45); // min
      const [quenchMedium, setQuenchMedium] = React.useState('water'); // furnace, air, oil, water, brine
      const [temperingTemp, setTemperingTemp] = React.useState(300); // 0 = None, 150-650
      const [hasTempering, setHasTempering] = React.useState(true);

      // Apply preset steel grade
      function handleGradePreset(gradeId) {
        const found = STEEL_GRADES.find(g => g.id === gradeId);
        if (found) {
          setCarbon(found.carbon);
          setAustTemp(found.a3 + 40); // 40°C above critical
        }
      }

      // =======================================================================
      // >>> SIMULATOR EXTENSION POINT <<<
      // To integrate advanced finite element analysis (FEA), Jominy end-quench
      // hardenability curves (ASTM A255), continuous cooling transformation
      // (CCT) kinetics, or multi-element alloy coefficients (Mn, Cr, Mo, Ni, V),
      // attach your mathematical solver hooks and custom state reducers here.
      // =======================================================================

      // Metallurgical Calculations
      const A1 = 727;
      // Calculate A3 or Acm based on carbon content
      const criticalTemp = carbon <= 0.76
        ? Math.round(912 - (912 - 727) * (carbon / 0.76)) // A3 curve
        : Math.round(727 + 305 * (carbon - 0.76)); // Acm curve
      const criticalLabel = carbon <= 0.76 ? 'A3' : 'Acm';

      // Martensite start (Andrews empirical model: Ms ≈ 539 - 423*C)
      const Ms = Math.round(539 - 423 * carbon);
      const Mf = Math.round(Ms - 215);

      // Quench media severity parameters
      const mediaSeverities = {
        furnace: { h: 0.005, name: 'Furnace Cool', rate: 0.005, label: 'Very Slow (~20°C/hr)' },
        air:     { h: 0.02,  name: 'Still Air',    rate: 1.5,   label: 'Moderate (~1.5°C/s)' },
        oil:     { h: 0.35,  name: 'Quench Oil',   rate: 55,    label: 'Fast (~55°C/s)' },
        water:   { h: 1.0,   name: 'Agitated Water', rate: 220, label: 'Rapid (~220°C/s)' },
        brine:   { h: 2.0,   name: 'Agitated Brine', rate: 450, label: 'Drastic (~450°C/s)' }
      };
      const activeMedia = mediaSeverities[quenchMedium];

      // Approximate critical cooling rate (CCR) in °C/s for plain carbon steels
      // CCR drops as carbon approaches eutectoid (~150°C/s at 0.8% C, ~500°C/s at 0.3% C)
      const CCR = Math.round(1000 * Math.pow(10, -1.2 * carbon));

      // Phase Prediction Logic
      let predictedPhase = '';
      let asQuenchedHRC = 15;
      let finalHRC = 15;
      let tensileStrength = 450;
      let yieldStrength = 300;
      let qualitativeToughness = 'Moderate';
      let retainedAustenite = 0;
      let warnings = [];

      // Check Austenitizing Condition
      if (austTemp < A1) {
        warnings.push({
          type: 'danger',
          text: `Subcritical Heating: Austenitizing temperature (${austTemp}°C) is below A1 (727°C). No austenite forms; microstructure remains unhardened (only stress-relief occurs).`
        });
        predictedPhase = 'Unaltered Ferrite + Pearlite (Subcritical Annealed)';
        asQuenchedHRC = Math.round(12 + carbon * 15);
        finalHRC = asQuenchedHRC;
        tensileStrength = Math.round(350 + carbon * 350);
        yieldStrength = Math.round(tensileStrength * 0.65);
        qualitativeToughness = 'High';
      } else if (austTemp < criticalTemp) {
        warnings.push({
          type: 'warning',
          text: `Intercritical Heating: Heated between A1 and ${criticalLabel} (${criticalTemp}°C). Incomplete austenitization will produce a soft dual-phase ferrite-martensite mixture with reduced hardenability.`
        });
        predictedPhase = 'Dual-Phase (Ferrite + Undissolved Carbides + Martensite)';
        asQuenchedHRC = Math.round(30 + carbon * 25);
        finalHRC = asQuenchedHRC;
      } else {
        // Full Austenitization reached
        if (quenchMedium === 'furnace') {
          predictedPhase = carbon < 0.76 ? 'Coarse Pearlite + Proeutectoid Ferrite' : 'Coarse Pearlite + Proeutectoid Cementite';
          asQuenchedHRC = Math.round(14 + carbon * 12);
          finalHRC = asQuenchedHRC;
          tensileStrength = Math.round(420 + carbon * 400);
          yieldStrength = Math.round(tensileStrength * 0.60);
          qualitativeToughness = 'Very High';
        } else if (quenchMedium === 'air') {
          predictedPhase = carbon < 0.76 ? 'Fine Pearlite + Network Ferrite' : 'Fine Pearlite + Intergranular Cementite';
          asQuenchedHRC = Math.round(20 + carbon * 16);
          finalHRC = asQuenchedHRC;
          tensileStrength = Math.round(550 + carbon * 480);
          yieldStrength = Math.round(tensileStrength * 0.68);
          qualitativeToughness = 'High';
        } else {
          // Liquid Quenches (Oil, Water, Brine)
          if (activeMedia.rate >= CCR) {
            // 100% Martensite
            // Maximum hardness follows empirical carbon relation: ~30 + 50*sqrt(C), capped at ~66 HRC
            asQuenchedHRC = Math.min(66, Math.round(30 + 46 * Math.sqrt(carbon)));
            
            // Retained Austenite if Mf is below room temperature (25°C)
            if (Mf < 25) {
              retainedAustenite = Math.min(30, Math.round((25 - Mf) * 0.12));
            }

            if (retainedAustenite > 5) {
              predictedPhase = `As-Quenched Martensite + ${retainedAustenite}% Retained Austenite`;
            } else {
              predictedPhase = '100% As-Quenched BCT Martensite';
            }

            // High carbon + rapid water/brine quench cracking risk
            if (carbon >= 0.40 && (quenchMedium === 'water' || quenchMedium === 'brine')) {
              warnings.push({
                type: 'danger',
                text: `Quench Cracking Hazard: Quenching ${carbon.toFixed(2)}% C steel in ${activeMedia.name} creates severe thermal gradients and localized volume expansion (+4%). High risk of catastrophic cracking! Quench oil or martempering is strongly recommended.`
              });
            }

            // Apply Tempering
            if (hasTempering && temperingTemp > 100) {
              if (temperingTemp >= 250 && temperingTemp <= 400) {
                warnings.push({
                  type: 'warning',
                  text: `Tempered Martensite Embrittlement (TME) Zone: Tempering between 250°C and 400°C precipitates interlath cementite films, causing a severe drop in Charpy notch toughness!`
                });
                qualitativeToughness = 'Low (TME Embrittlement)';
              } else if (temperingTemp > 400) {
                qualitativeToughness = 'Very High';
              } else {
                qualitativeToughness = 'Moderate';
              }

              // Tempering hardness drop calculation
              const deltaT = temperingTemp - 150;
              const hardnessDrop = Math.max(0, Math.round(deltaT * 0.065));
              finalHRC = Math.max(24, asQuenchedHRC - hardnessDrop);
              predictedPhase = `Tempered Martensite (Carbide dispersion in α-Fe)`;
              tensileStrength = Math.round(finalHRC * 33 + 220);
              yieldStrength = Math.round(tensileStrength * 0.88);
            } else {
              finalHRC = asQuenchedHRC;
              qualitativeToughness = 'Extremely Brittle';
              tensileStrength = Math.round(finalHRC * 35 + 200);
              yieldStrength = Math.round(tensileStrength * 0.95);
              warnings.push({
                type: 'info',
                text: 'Untempered Martensite: High internal lattice strains present. Components without immediate tempering are prone to delayed spontaneous cracking.'
              });
            }

          } else {
            // Insufficient cooling rate: mixed structure (Martensite + Bainite / Pearlite)
            asQuenchedHRC = Math.round(35 + carbon * 25);
            finalHRC = asQuenchedHRC;
            predictedPhase = 'Mixed Microstructure (Martensite + Upper Bainite + Fine Pearlite)';
            tensileStrength = Math.round(finalHRC * 30 + 200);
            yieldStrength = Math.round(tensileStrength * 0.72);
            qualitativeToughness = 'Moderate';
            warnings.push({
              type: 'info',
              text: `Cooling rate of ${activeMedia.name} (~${activeMedia.rate}°C/s) did not fully exceed the Critical Cooling Rate (${CCR}°C/s). Incomplete hardening resulted in non-martensitic products.`
            });
          }
        }
      }

      // Check Grain Coarsening
      if (austTemp >= 1000) {
        warnings.push({
          type: 'warning',
          text: `Excessive Austenitizing Temperature (${austTemp}°C): Rapid prior austenite grain growth occurs above 1000°C, degrading final fracture toughness (Hall-Petch penalty).`
        });
      }

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
          
          {/* Header */}
          <div className="border-b border-steel-800 pb-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h1 className="font-display text-3xl sm:text-4xl font-bold uppercase tracking-wider text-white flex items-center gap-2">
                  <Icons.Sliders /> Heat Treatment Simulator
                </h1>
                <p className="text-steel-400 text-xs sm:text-sm mt-1">
                  Virtual metallurgical furnace & quench tank. Predicts phase transformations, hardness, and mechanical yield based on carbon thermodynamics.
                </p>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono text-steel-400 uppercase">Presets:</span>
                {STEEL_GRADES.map(g => (
                  <button
                    key={g.id}
                    onClick={() => handleGradePreset(g.id)}
                    className="px-2 py-1 rounded bg-charcoal-800 border border-steel-700 text-xs font-mono text-steel-200 hover:text-white hover:border-furnace-amber transition-colors"
                  >
                    {g.id}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Grid: Controls (Left) and Live Readouts / Graph (Right) */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* CONTROL PANEL */}
            <div className="lg:col-span-5 space-y-6 bg-charcoal-850 p-6 rounded-lg border border-steel-800 shadow-xl">
              <h2 className="font-mono text-xs uppercase tracking-wider text-steel-300 font-bold border-b border-steel-800 pb-2 flex items-center justify-between">
                <span>Furnace Controls</span>
                <span className="text-[10px] text-furnace-amber">● ONLINE</span>
              </h2>

              {/* Carbon Content Slider */}
              <div className="space-y-1.5">
                <div className="flex justify-between text-xs font-mono">
                  <label htmlFor="carbon-slider" className="text-steel-300 font-semibold">Carbon Content (wt% C):</label>
                  <span className="text-furnace-gold font-bold text-sm">{carbon.toFixed(2)} %</span>
                </div>
                <input
                  id="carbon-slider"
                  type="range"
                  min="0.10"
                  max="1.20"
                  step="0.01"
                  value={carbon}
                  onChange={(e) => setCarbon(parseFloat(e.target.value))}
                  className="w-full accent-furnace-amber h-2 bg-charcoal-900 rounded-lg cursor-pointer"
                />
                <div className="flex justify-between text-[10px] font-mono text-steel-500">
                  <span>0.10% (Low C)</span>
                  <span>0.76% (Eutectoid)</span>
                  <span>1.20% (High C)</span>
                </div>
              </div>

              {/* Austenitizing Temperature Slider */}
              <div className="space-y-1.5">
                <div className="flex justify-between text-xs font-mono">
                  <label htmlFor="temp-slider" className="text-steel-300 font-semibold">Austenitizing Temp (°C):</label>
                  <span className="text-furnace-amber font-bold text-sm">{austTemp} °C</span>
                </div>
                <input
                  id="temp-slider"
                  type="range"
                  min="700"
                  max="1100"
                  step="5"
                  value={austTemp}
                  onChange={(e) => setAustTemp(parseInt(e.target.value))}
                  className="w-full accent-furnace-amber h-2 bg-charcoal-900 rounded-lg cursor-pointer"
                />
                <div className="flex justify-between text-[10px] font-mono text-steel-500">
                  <span>700°C</span>
                  <span className="text-furnace-gold font-bold">A1: 727°C</span>
                  <span className="text-furnace-flame font-bold">{criticalLabel}: {criticalTemp}°C</span>
                  <span>1100°C</span>
                </div>
              </div>

              {/* Soak Time Slider */}
              <div className="space-y-1.5">
                <div className="flex justify-between text-xs font-mono">
                  <label htmlFor="soak-slider" className="text-steel-300 font-semibold">Soak Time (minutes):</label>
                  <span className="text-white font-bold">{soakTime} min</span>
                </div>
                <input
                  id="soak-slider"
                  type="range"
                  min="10"
                  max="120"
                  step="5"
                  value={soakTime}
                  onChange={(e) => setSoakTime(parseInt(e.target.value))}
                  className="w-full accent-furnace-amber h-2 bg-charcoal-900 rounded-lg cursor-pointer"
                />
                <div className="flex justify-between text-[10px] font-mono text-steel-500">
                  <span>10 min</span>
                  <span>60 min (1 hr)</span>
                  <span>120 min</span>
                </div>
              </div>

              {/* Quench Medium Selector */}
              <div className="space-y-1.5">
                <label className="block text-xs font-mono text-steel-300 font-semibold">Quench Cooling Medium:</label>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-xs font-mono">
                  {[
                    { id: 'furnace', name: 'Furnace', h: 'H=0.005' },
                    { id: 'air',     name: 'Still Air', h: 'H=0.02' },
                    { id: 'oil',     name: 'Quench Oil', h: 'H=0.35' },
                    { id: 'water',   name: 'Water', h: 'H=1.0' },
                    { id: 'brine',   name: 'Brine 10%', h: 'H=2.0' }
                  ].map((m) => (
                    <button
                      key={m.id}
                      type="button"
                      onClick={() => setQuenchMedium(m.id)}
                      className={`p-2 rounded border text-left transition-colors ${
                        quenchMedium === m.id
                          ? 'bg-quench-500/20 border-quench-400 text-quench-400 font-bold'
                          : 'bg-charcoal-900 border-steel-750 text-steel-400 hover:text-white hover:border-steel-600'
                      }`}
                    >
                      <div className="text-xs">{m.name}</div>
                      <div className="text-[10px] text-steel-500">{m.h}</div>
                    </button>
                  ))}
                </div>
              </div>

              {/* Tempering Controls */}
              <div className="space-y-2 pt-2 border-t border-steel-800">
                <div className="flex items-center justify-between">
                  <label className="text-xs font-mono text-steel-300 font-semibold flex items-center gap-2">
                    <input
                      type="checkbox"
                      checked={hasTempering}
                      onChange={(e) => setHasTempering(e.target.checked)}
                      className="rounded bg-charcoal-900 border-steel-700 text-furnace-amber focus:ring-furnace-amber"
                    />
                    Include Secondary Tempering
                  </label>
                  {hasTempering && (
                    <span className="text-xs font-mono text-emerald-400 font-bold">{temperingTemp} °C</span>
                  )}
                </div>

                {hasTempering && (
                  <div className="space-y-1">
                    <input
                      type="range"
                      min="150"
                      max="650"
                      step="10"
                      value={temperingTemp}
                      onChange={(e) => setTemperingTemp(parseInt(e.target.value))}
                      className="w-full accent-emerald-500 h-2 bg-charcoal-900 rounded-lg cursor-pointer"
                    />
                    <div className="flex justify-between text-[10px] font-mono text-steel-500">
                      <span>150°C (Stress relief)</span>
                      <span className="text-furnace-amber font-semibold">250-400°C (TME)</span>
                      <span>650°C (Tough)</span>
                    </div>
                  </div>
                )}
              </div>

            </div>

            {/* SIMULATION READOUTS & REAL-TIME THERMAL GRAPH */}
            <div className="lg:col-span-7 space-y-6">
              
              {/* Primary Output Cards */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 font-mono">
                <div className="p-3 rounded bg-charcoal-850 border border-steel-800">
                  <span className="text-[10px] uppercase text-steel-400 block">Final Hardness</span>
                  <span className="text-2xl font-bold text-furnace-gold">{finalHRC}</span>
                  <span className="text-[11px] text-steel-500 ml-1">HRC</span>
                </div>
                <div className="p-3 rounded bg-charcoal-850 border border-steel-800">
                  <span className="text-[10px] uppercase text-steel-400 block">Tensile Strength</span>
                  <span className="text-2xl font-bold text-white">{tensileStrength}</span>
                  <span className="text-[11px] text-steel-500 ml-1">MPa</span>
                </div>
                <div className="p-3 rounded bg-charcoal-850 border border-steel-800">
                  <span className="text-[10px] uppercase text-steel-400 block">Yield Strength</span>
                  <span className="text-2xl font-bold text-quench-400">{yieldStrength}</span>
                  <span className="text-[11px] text-steel-500 ml-1">MPa</span>
                </div>
                <div className="p-3 rounded bg-charcoal-850 border border-steel-800">
                  <span className="text-[10px] uppercase text-steel-400 block">Toughness Rating</span>
                  <span className="text-sm font-bold text-emerald-400 block truncate mt-1">{qualitativeToughness}</span>
                  <span className="text-[10px] text-steel-500">Charpy Impact</span>
                </div>
              </div>

              {/* Predicted Microstructure Banner */}
              <div className="p-4 rounded-lg bg-charcoal-850 border border-steel-800">
                <span className="font-mono text-xs uppercase tracking-wider text-steel-400 block mb-1">
                  Predicted Room-Temperature Microstructure:
                </span>
                <div className="font-display text-xl font-bold text-furnace-amber uppercase tracking-wide">
                  {predictedPhase}
                </div>
                <div className="flex flex-wrap gap-4 mt-2 text-xs font-mono text-steel-400">
                  <span>Ms: <strong className="text-white">{Ms}°C</strong></span>
                  <span>Mf: <strong className="text-white">{Mf < 0 ? `${Mf}°C (Sub-zero)` : `${Mf}°C`}</strong></span>
                  <span>CCR: <strong className="text-white">~{CCR} °C/s</strong></span>
                  {retainedAustenite > 0 && (
                    <span className="text-furnace-amber">Retained Austenite: <strong>{retainedAustenite}%</strong></span>
                  )}
                </div>
              </div>

              {/* Scientific Warnings Box */}
              {warnings.length > 0 && (
                <div className="space-y-2">
                  {warnings.map((w, idx) => (
                    <div
                      key={idx}
                      className={`p-3 rounded text-xs flex items-start gap-3 border ${
                        w.type === 'danger'
                          ? 'bg-red-950/40 border-red-800/80 text-red-200'
                          : w.type === 'warning'
                          ? 'bg-amber-950/40 border-amber-800/80 text-amber-200'
                          : 'bg-charcoal-800 border-steel-700 text-steel-300'
                      }`}
                    >
                      <Icons.Alert />
                      <div className="leading-relaxed">{w.text}</div>
                    </div>
                  ))}
                </div>
              )}

              {/* Real-Time SVG Thermal Cycle Curve with A1/A3/Ms Reference Lines */}
              <div className="p-4 rounded-lg bg-charcoal-850 border border-steel-800">
                <div className="flex items-center justify-between mb-3 text-xs font-mono text-steel-400">
                  <span>SIMULATED TEMPERATURE-TIME PROFILE</span>
                  <span>X: Time | Y: Temperature (°C)</span>
                </div>

                <div className="relative w-full h-56 bg-charcoal-900 rounded border border-steel-800 p-2 overflow-hidden">
                  <svg className="w-full h-full" viewBox="0 0 600 220" preserveAspectRatio="none">
                    {/* Horizontal Reference Lines */}
                    {/* 1000°C */}
                    <line x1="40" y1="20" x2="590" y2="20" stroke="#334155" strokeDasharray="3 3" />
                    <text x="5" y="24" fill="#64748b" fontSize="9" fontFamily="monospace">1000°C</text>

                    {/* A3/Acm line */}
                    <line
                      x1="40"
                      y1={200 - (criticalTemp / 1100) * 190}
                      x2="590"
                      y2={200 - (criticalTemp / 1100) * 190}
                      stroke="#ea580c"
                      strokeDasharray="4 4"
                      strokeWidth="1.2"
                    />
                    <text x="5" y={204 - (criticalTemp / 1100) * 190} fill="#ea580c" fontSize="9" fontFamily="monospace">
                      {criticalLabel} ({criticalTemp})
                    </text>

                    {/* A1 (727°C) line */}
                    <line
                      x1="40"
                      y1={200 - (727 / 1100) * 190}
                      x2="590"
                      y2={200 - (727 / 1100) * 190}
                      stroke="#fbbf24"
                      strokeDasharray="4 4"
                      strokeWidth="1.2"
                    />
                    <text x="5" y={204 - (727 / 1100) * 190} fill="#fbbf24" fontSize="9" fontFamily="monospace">
                      A1 (727)
                    </text>

                    {/* Ms line */}
                    {Ms > 0 && (
                      <>
                        <line
                          x1="40"
                          y1={200 - (Ms / 1100) * 190}
                          x2="590"
                          y2={200 - (Ms / 1100) * 190}
                          stroke="#38bdf8"
                          strokeDasharray="2 2"
                          strokeWidth="1"
                        />
                        <text x="5" y={204 - (Ms / 1100) * 190} fill="#38bdf8" fontSize="9" fontFamily="monospace">
                          Ms ({Ms})
                        </text>
                      </>
                    )}

                    {/* Thermal Cycle Curve Construction */}
                    {(() => {
                      // Coordinates calculation:
                      // Total width 550 px (from x=45 to x=590)
                      // Y: 200 = 20°C, 10 = 1100°C
                      const getY = (t) => 200 - (Math.min(1100, Math.max(20, t)) / 1100) * 190;
                      
                      const p0 = { x: 45, y: getY(20) };
                      const p1 = { x: 120, y: getY(austTemp) }; // Heating ramp
                      const p2 = { x: 120 + (soakTime / 120) * 130, y: getY(austTemp) }; // Soak hold
                      
                      // Quench cooling speed
                      const quenchDuration = quenchMedium === 'furnace' ? 180 : quenchMedium === 'air' ? 100 : 15;
                      const p3 = { x: Math.min(420, p2.x + quenchDuration), y: getY(25) };

                      // Tempering curve
                      let pointsStr = `${p0.x},${p0.y} ${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`;

                      if (hasTempering && temperingTemp > 100) {
                        const p4 = { x: p3.x + 20, y: getY(temperingTemp) };
                        const p5 = { x: p4.x + 70, y: getY(temperingTemp) };
                        const p6 = { x: Math.min(585, p5.x + 40), y: getY(20) };
                        pointsStr += ` ${p4.x},${p4.y} ${p5.x},${p5.y} ${p6.x},${p6.y}`;
                      }

                      return (
                        <>
                          <polyline
                            fill="none"
                            stroke="#f97316"
                            strokeWidth="2.5"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                            points={pointsStr}
                          />
                          {/* Key stage node markers */}
                          <circle cx={p1.x} cy={p1.y} r="3.5" fill="#ea580c" />
                          <circle cx={p2.x} cy={p2.y} r="3.5" fill="#fbbf24" />
                          <circle cx={p3.x} cy={p3.y} r="3.5" fill="#38bdf8" />
                        </>
                      );
                    })()}
                  </svg>
                </div>

    /**
     * PAGE 4: MICROSTRUCTURE ATLAS (#/microstructure)
     * High-fidelity procedural canvas metallography renderer.
     */
    function MicrostructurePage() {
      const [selectedPhaseId, setSelectedPhaseId] = React.useState('pearlite');
      const [magnification, setMagnification] = React.useState(400); // 100x to 1000x
      const [showBoundaries, setShowBoundaries] = React.useState(true);

      const activePhase = MICROSTRUCTURES_DATA.find(m => m.id === selectedPhaseId) || MICROSTRUCTURES_DATA[0];
      const canvasRef = React.useRef(null);

      // Seeded Pseudo-Random Number Generator (PRNG) for deterministic visual stability
      function createPRNG(seed) {
        let s = seed >>> 0;
        return function() {
          s = (s + 0x6D2B79F5) | 0;
          let t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      // Procedural Canvas Metallography Renderer
      React.useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Clear canvas
        ctx.fillStyle = '#171922';
        ctx.fillRect(0, 0, width, height);

        const prng = createPRNG(1337);
        const scaleFactor = magnification / 400; // Normalized to 400x

        // Render based on phase type
        switch (activePhase.id) {
          case 'austenite': {
            // Equiaxed polygonal FCC grains with annealing twins
            const grainCount = Math.round(18 / scaleFactor);
            const seeds = [];
            for (let i = 0; i < grainCount; i++) {
              seeds.push({
                x: prng() * width,
                y: prng() * height,
                color: `hsl(215, 12%, ${65 + prng() * 15}%)`,
                hasTwin: prng() > 0.45,
                twinAngle: prng() * Math.PI
              });
            }

            // Voronoi tessellation approximation
            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y += 2) {
              for (let x = 0; x < width; x += 2) {
                let minDist = Infinity;
                let secondDist = Infinity;
                let closest = 0;

                for (let i = 0; i < seeds.length; i++) {
                  const dx = x - seeds[i].x;
                  const dy = y - seeds[i].y;
                  const d = dx * dx + dy * dy;
                  if (d < minDist) {
                    secondDist = minDist;
                    minDist = d;
                    closest = i;
                  } else if (d < secondDist) {
                    secondDist = d;
                  }
                }

                // Grain boundary detection
                const isBoundary = showBoundaries && Math.abs(Math.sqrt(secondDist) - Math.sqrt(minDist)) < 1.5;
                const brightness = isBoundary ? 30 : (160 + (closest % 5) * 15);

                for (let dy = 0; dy < 2; dy++) {
                  for (let dx = 0; dx < 2; dx++) {
                    const idx = ((y + dy) * width + (x + dx)) * 4;
                    data[idx] = brightness;
                    data[idx + 1] = brightness + 4;
                    data[idx + 2] = brightness + 10;
                    data[idx + 3] = 255;
                  }
                }
              }
            }
            ctx.putImageData(imgData, 0, 0);

            // Draw Annealing Twins inside grains
            if (activePhase.canvasConfig.showTwins) {
              ctx.lineWidth = 1.2;
              seeds.forEach(s => {
                if (s.hasTwin) {
                  ctx.strokeStyle = 'rgba(71, 85, 105, 0.7)';
                  ctx.beginPath();
                  const len = 35 * scaleFactor;
                  ctx.moveTo(s.x - Math.cos(s.twinAngle) * len, s.y - Math.sin(s.twinAngle) * len);
                  ctx.lineTo(s.x + Math.cos(s.twinAngle) * len, s.y + Math.sin(s.twinAngle) * len);
                  ctx.stroke();
                }
              });
            }
            break;
          }

          case 'ferrite': {
            // Light etching, clean polygonal grains with 120° triple junctions
            const grainCount = Math.round(24 / scaleFactor);
            const seeds = [];
            for (let i = 0; i < grainCount; i++) {
              seeds.push({ x: prng() * width, y: prng() * height });
            }

            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y += 2) {
              for (let x = 0; x < width; x += 2) {
                let minDist = Infinity;
                let secondDist = Infinity;
                let closest = 0;

                for (let i = 0; i < seeds.length; i++) {
                  const d = (x - seeds[i].x) ** 2 + (y - seeds[i].y) ** 2;
                  if (d < minDist) {
                    secondDist = minDist;
                    minDist = d;
                    closest = i;
                  } else if (d < secondDist) {
                    secondDist = d;
                  }
                }

                const isBoundary = showBoundaries && Math.abs(Math.sqrt(secondDist) - Math.sqrt(minDist)) < 1.2;
                const shade = isBoundary ? 40 : (225 + (closest % 4) * 8);

                for (let dy = 0; dy < 2; dy++) {
                  for (let dx = 0; dx < 2; dx++) {
                    const idx = ((y + dy) * width + (x + dx)) * 4;
                    data[idx] = shade;
                    data[idx + 1] = shade;
                    data[idx + 2] = shade + 2;
                    data[idx + 3] = 255;
                  }
                }
              }
            }
            ctx.putImageData(imgData, 0, 0);
            break;
          }

          case 'pearlite': {
            // Pearlite colonies with alternating lamellae plates (ferrite + cementite)
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(0, 0, width, height);

            const colonyCount = Math.round(14 / Math.sqrt(scaleFactor));
            const colonies = [];
            for (let i = 0; i < colonyCount; i++) {
              colonies.push({
                x: prng() * width,
                y: prng() * height,
                angle: prng() * Math.PI,
                spacing: (4.5 * scaleFactor)
              });
            }

            // Draw parallel stripes per colony
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = Math.max(1, 1.8 * scaleFactor);

            colonies.forEach(col => {
              const radius = (60 * scaleFactor);
              ctx.save();
              ctx.beginPath();
              ctx.arc(col.x, col.y, radius, 0, Math.PI * 2);
              ctx.clip();

              const cos = Math.cos(col.angle);
              const sin = Math.sin(col.angle);

              for (let d = -radius; d <= radius; d += col.spacing) {
                ctx.beginPath();
                ctx.moveTo(col.x + cos * d - sin * radius, col.y + sin * d + cos * radius);
                ctx.lineTo(col.x + cos * d + sin * radius, col.y + sin * d - cos * radius);
                ctx.stroke();
              }
              ctx.restore();
            });

            // Draw colony boundary outlines
            if (showBoundaries) {
              ctx.strokeStyle = 'rgba(15, 23, 42, 0.6)';
              ctx.lineWidth = 1.5;
              colonies.forEach(col => {
                ctx.beginPath();
                ctx.arc(col.x, col.y, 60 * scaleFactor, 0, Math.PI * 2);
                ctx.stroke();
              });
            }
            break;
          }

          case 'martensite': {
            // Acicular laths and lenticular intersecting needles
            ctx.fillStyle = '#64748b';
            ctx.fillRect(0, 0, width, height);

            const needleCount = Math.round(120 * scaleFactor);
            for (let i = 0; i < needleCount; i++) {
              const cx = prng() * width;
              const cy = prng() * height;
              const length = (25 + prng() * 45) * scaleFactor;
              const angle = prng() * Math.PI * 2;
              const thickness = Math.max(1, (1.5 + prng() * 2) * scaleFactor);

              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate(angle);

              // Needle shape (elongated double wedge)
              ctx.fillStyle = prng() > 0.4 ? '#1e293b' : '#0f172a';
              ctx.beginPath();
              ctx.moveTo(-length / 2, 0);
              ctx.lineTo(0, -thickness);
              ctx.lineTo(length / 2, 0);
              ctx.lineTo(0, thickness);
              ctx.closePath();
              ctx.fill();

              ctx.restore();
            }
            break;
          }

          case 'bainite-upper':
          case 'bainite-lower': {
            // Feathery (upper) or fine acicular (lower) with dispersed carbides
            ctx.fillStyle = '#475569';
            ctx.fillRect(0, 0, width, height);

            const isLower = activePhase.id === 'bainite-lower';
            const count = Math.round((isLower ? 140 : 80) * scaleFactor);

            for (let i = 0; i < count; i++) {
              const cx = prng() * width;
              const cy = prng() * height;
              const length = (20 + prng() * 30) * scaleFactor;
              const angle = prng() * Math.PI;

              ctx.strokeStyle = isLower ? '#0f172a' : '#1e293b';
              ctx.lineWidth = Math.max(1, (isLower ? 1.2 : 2.5) * scaleFactor);

              ctx.beginPath();
              ctx.moveTo(cx - Math.cos(angle) * (length / 2), cy - Math.sin(angle) * (length / 2));
              ctx.lineTo(cx + Math.cos(angle) * (length / 2), cy + Math.sin(angle) * (length / 2));
              ctx.stroke();

              // Carbide stipples
              ctx.fillStyle = '#0f172a';
              for (let c = 0; c < 4; c++) {
                const ox = (prng() - 0.5) * length * 0.8;
                const oy = (prng() - 0.5) * 4;
                ctx.beginPath();
                ctx.arc(cx + ox, cy + oy, 0.8 * scaleFactor, 0, Math.PI * 2);
                ctx.fill();
              }
            }
            break;
          }

          case 'spheroidite': {
            // Continuous ferrite matrix with rounded globular cementite spheres
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(0, 0, width, height);

            const sphereCount = Math.round(110 * scaleFactor);
            for (let i = 0; i < sphereCount; i++) {
              const x = prng() * width;
              const y = prng() * height;
              const radius = (2.2 + prng() * 4.5) * scaleFactor;

              // Dark spherical particle
              ctx.fillStyle = '#1e293b';
              ctx.beginPath();
              ctx.arc(x, y, radius, 0, Math.PI * 2);
              ctx.fill();

              // Subtle 3D highlight
              ctx.fillStyle = '#475569';
              ctx.beginPath();
              ctx.arc(x - radius * 0.3, y - radius * 0.3, radius * 0.4, 0, Math.PI * 2);
              ctx.fill();
            }
            break;
          }

          case 'tempered-martensite': {
            // Relaxed ferrite matrix with dense submicron carbide dispersion
            ctx.fillStyle = '#3f3f46';
            ctx.fillRect(0, 0, width, height);

            const carbideCount = Math.round(280 * scaleFactor);
            for (let i = 0; i < carbideCount; i++) {
              const x = prng() * width;
              const y = prng() * height;
              const radius = (0.7 + prng() * 1.5) * scaleFactor;

              ctx.fillStyle = '#18181b';
              ctx.beginPath();
              ctx.arc(x, y, radius, 0, Math.PI * 2);
              ctx.fill();
            }
            break;
          }

          case 'cementite': {
            // Thick intergranular network along grain boundaries
            ctx.fillStyle = '#475569';
            ctx.fillRect(0, 0, width, height);

            const grainCount = Math.round(15 / scaleFactor);
            const seeds = [];
            for (let i = 0; i < grainCount; i++) {
              seeds.push({ x: prng() * width, y: prng() * height });
            }

            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y += 2) {
              for (let x = 0; x < width; x += 2) {
                let minDist = Infinity;
                let secondDist = Infinity;

                for (let i = 0; i < seeds.length; i++) {
                  const d = (x - seeds[i].x) ** 2 + (y - seeds[i].y) ** 2;
                  if (d < minDist) {
                    secondDist = minDist;
                    minDist = d;
                  } else if (d < secondDist) {
                    secondDist = d;
                  }
                }

                const diff = Math.abs(Math.sqrt(secondDist) - Math.sqrt(minDist));
                // Bright white boundary = cementite network
                const isCementite = diff < (4 * scaleFactor);
                const val = isCementite ? 245 : 65;

                for (let dy = 0; dy < 2; dy++) {
                  for (let dx = 0; dx < 2; dx++) {
                    const idx = ((y + dy) * width + (x + dx)) * 4;
                    data[idx] = val;
                    data[idx + 1] = val;
                    data[idx + 2] = val;
                    data[idx + 3] = 255;
                  }
                }
              }
            }
            ctx.putImageData(imgData, 0, 0);
            break;
          }

          default:
            break;
        }

        // Add calibration scale bar on bottom right
        ctx.fillStyle = 'rgba(11, 11, 13, 0.85)';
        ctx.fillRect(width - 120, height - 32, 110, 24);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(width - 105, height - 16, 50, 3);
        ctx.font = '10px monospace';
        ctx.fillText(`${Math.round(50 / scaleFactor)} µm`, width - 50, height - 14);

      }, [activePhase, magnification, showBoundaries]);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
          
          <div className="border-b border-steel-800 pb-4">
            <h1 className="font-display text-3xl sm:text-4xl font-bold uppercase tracking-wider text-white flex items-center gap-2">
              <Icons.Crystal /> Microstructure Canvas Atlas
            </h1>
            <p className="text-steel-400 text-xs sm:text-sm mt-1">
              Virtual optical metallography simulator. Procedural crystal morphology rendered from first-principles microstructure kinetics.
            </p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            {/* Phase Selector Tabs (Left) */}
            <div className="lg:col-span-4 space-y-2">
              <span className="font-mono text-xs uppercase tracking-wider text-steel-400 block mb-2 font-bold">
                Select Microstructural Constituent:
              </span>
              <div className="space-y-1.5">
                {MICROSTRUCTURES_DATA.map(m => {
                  const isSelected = m.id === selectedPhaseId;
                  return (
                    <button
                      key={m.id}
                      onClick={() => setSelectedPhaseId(m.id)}
                      className={`w-full p-3 rounded-lg border text-left transition-all ${
                        isSelected
                          ? 'bg-charcoal-800 border-quench-400 text-white font-bold'
                          : 'bg-charcoal-850 border-steel-800 text-steel-300 hover:border-steel-700 hover:text-white'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <span className="font-display tracking-wide">{m.name}</span>
                        <span className="text-[10px] font-mono text-steel-400">{m.crystalSystem.split(' ')[0]}</span>
                      </div>
                      <div className="text-[11px] font-mono text-steel-400 mt-0.5 truncate">
                        {m.typicalHardness}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            {/* Canvas Viewer & Controls (Middle & Right) */}
            <div className="lg:col-span-8 space-y-6">
              
              {/* Microscope Controls Bar */}
              <div className="p-4 rounded-lg bg-charcoal-850 border border-steel-800 flex flex-wrap items-center justify-between gap-4 font-mono text-xs">
                {/* Magnification Slider */}
                <div className="flex items-center gap-3">
                  <label htmlFor="mag-slider" className="text-steel-300 font-semibold">Magnification:</label>
                  <input
                    id="mag-slider"
                    type="range"
                    min="100"
                    max="1000"
                    step="50"
                    value={magnification}
                    onChange={(e) => setMagnification(parseInt(e.target.value))}
                    className="w-32 accent-quench-400 cursor-pointer"
                  />
                  <span className="text-quench-400 font-bold w-14">{magnification}x</span>
                </div>

                {/* Grain Boundary Toggle */}
                <label className="flex items-center gap-2 cursor-pointer text-steel-300">
                  <input

    /**
     * PAGE 6: QUIZ (#/quiz)
     */
    function QuizPage() {
      // Shuffled selection of 10 questions from the 15-question bank
      const [questions, setQuestions] = React.useState([]);
      const [currentIndex, setCurrentIndex] = React.useState(0);
      const [selectedChoice, setSelectedChoice] = React.useState(null);
      const [isAnswered, setIsAnswered] = React.useState(false);
      const [userAnswers, setUserAnswers] = React.useState([]); // records { qIndex, choice, isCorrect }
      const [quizCompleted, setQuizCompleted] = React.useState(false);
      const [candidateName, setCandidateName] = React.useState('Metallurgy Specialist');

      // Initialize / Reset Quiz
      const initQuiz = React.useCallback(() => {
        // Shuffle and pick 10
        const shuffled = [...QUIZ_QUESTIONS].sort(() => 0.5 - Math.random()).slice(0, 10);
        setQuestions(shuffled);
        setCurrentIndex(0);
        setSelectedChoice(null);
        setIsAnswered(false);
        setUserAnswers([]);
        setQuizCompleted(false);
      }, []);

      React.useEffect(() => {
        initQuiz();
      }, [initQuiz]);

      if (questions.length === 0) return null;

      const currentQ = questions[currentIndex];
      const score = userAnswers.filter(a => a.isCorrect).length;

      function handleSelectOption(idx) {
        if (!isAnswered) {
          setSelectedChoice(idx);
        }
      }

      function handleConfirmAnswer() {
        if (selectedChoice === null || isAnswered) return;
        const isCorrect = selectedChoice === currentQ.correctIndex;
        setIsAnswered(true);
        setUserAnswers([...userAnswers, { question: currentQ, choice: selectedChoice, isCorrect }]);
      }

      function handleNextQuestion() {
        if (currentIndex + 1 < questions.length) {
          setCurrentIndex(currentIndex + 1);
          setSelectedChoice(null);
          setIsAnswered(false);
        } else {
          setQuizCompleted(true);
        }
      }

      // Quiz Result Tier
      const percentage = Math.round((score / questions.length) * 100);
      let tier = 'Apprentice Metallurgist';
      let tierColor = 'text-steel-400';
      if (percentage >= 90) {
        tier = 'Master Heat Treating Engineer';
        tierColor = 'text-furnace-gold';
      } else if (percentage >= 70) {
        tier = 'Certified Thermal Process Specialist';
        tierColor = 'text-emerald-400';
      } else if (percentage >= 50) {
        tier = 'Journeyman Heat Treater';
        tierColor = 'text-quench-400';
      }

      return (
        <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
          
          <div className="border-b border-steel-800 pb-4 flex items-center justify-between">
            <div>
              <h1 className="font-display text-3xl sm:text-4xl font-bold uppercase tracking-wider text-white flex items-center gap-2">
                <Icons.Quiz /> Metallurgical Certification Quiz
              </h1>
              <p className="text-steel-400 text-xs sm:text-sm mt-1">
                Validate your expertise on phase diagrams, diffusion kinetics, martensite transformation, and quench media.
              </p>
            </div>
            {!quizCompleted && (
              <div className="text-right font-mono text-xs">
                <span className="text-steel-500">Progress:</span>
                <div className="text-white font-bold">{currentIndex + 1} / {questions.length}</div>
              </div>
            )}
          </div>

          {!quizCompleted ? (
            <div className="space-y-6">
              
              {/* Progress Bar */}
              <div className="w-full h-2 rounded bg-charcoal-800 overflow-hidden">
                <div
                  className="h-full bg-gradient-to-r from-furnace-red via-furnace-amber to-furnace-gold transition-all duration-300"
                  style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}
                />
              </div>

              {/* Question Card */}
              <div className="p-6 sm:p-8 rounded-lg bg-charcoal-850 border border-steel-800 space-y-6 shadow-xl">
                
                <div className="flex items-center justify-between text-xs font-mono">
                  <span className="px-2.5 py-1 rounded bg-charcoal-900 text-furnace-amber border border-steel-800 font-bold">
                    {currentQ.category}
                  </span>
                  <span className="text-steel-500">Current Score: {score}</span>
                </div>

                <h2 className="text-base sm:text-lg font-semibold text-white leading-relaxed">
                  {currentQ.question}
                </h2>

                {/* Option Choices */}
                <div className="space-y-3" role="radiogroup">
                  {currentQ.options.map((opt, idx) => {
                    let btnStyle = 'bg-charcoal-900 border-steel-750 text-steel-200 hover:border-steel-600';
                    
                    if (isAnswered) {
                      if (idx === currentQ.correctIndex) {
                        btnStyle = 'bg-emerald-950/60 border-emerald-500 text-emerald-200 font-bold';
                      } else if (idx === selectedChoice) {
                        btnStyle = 'bg-red-950/60 border-red-500 text-red-200';
                      } else {
                        btnStyle = 'bg-charcoal-900/40 border-steel-850 text-steel-500 opacity-60';
                      }
                    } else if (selectedChoice === idx) {
                      btnStyle = 'bg-charcoal-800 border-furnace-amber text-furnace-amber font-semibold';
                    }

                    return (
                      <button
                        key={idx}
                        type="button"
                        disabled={isAnswered}
                        onClick={() => handleSelectOption(idx)}
                        className={`w-full p-4 rounded-lg border text-left text-sm transition-all flex items-start gap-3 ${btnStyle}`}
                      >
                        <span className="w-6 h-6 rounded-full border border-current flex items-center justify-center text-xs font-mono flex-shrink-0 mt-0.5">
                          {String.fromCharCode(65 + idx)}
                        </span>
                        <span className="leading-snug">{opt}</span>
                      </button>
                    );
                  })}
                </div>

                {/* Action Button: Confirm or Next */}
                <div className="pt-4 border-t border-steel-800 flex items-center justify-between">
                  <span className="text-xs font-mono text-steel-500">
                    {!isAnswered ? 'Select an answer above' : 'Review explanation below'}
                  </span>

                  {!isAnswered ? (
                    <button
                      type="button"
                      disabled={selectedChoice === null}
                      onClick={handleConfirmAnswer}
                      className="px-6 py-2.5 rounded bg-furnace-amber text-charcoal-950 font-bold text-xs uppercase tracking-wider hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed transition-all"
                    >
                      Submit Answer
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={handleNextQuestion}
                      className="px-6 py-2.5 rounded bg-gradient-to-r from-furnace-red via-furnace-flame to-furnace-amber text-charcoal-950 font-bold text-xs uppercase tracking-wider hover:brightness-110 transition-all flex items-center gap-1.5"
                    >
                      {currentIndex + 1 < questions.length ? 'Next Question' : 'View Final Results'} <Icons.ArrowRight />
                    </button>
                  )}
                </div>

                {/* Instant Scientific Explanation Box */}
                {isAnswered && (
                  <div className={`p-4 rounded-lg text-xs leading-relaxed border ${
                    selectedChoice === currentQ.correctIndex
                      ? 'bg-emerald-950/40 border-emerald-800 text-emerald-200'
                      : 'bg-red-950/40 border-red-800 text-red-200'
                  }`}>
                    <div className="font-mono font-bold uppercase mb-1 flex items-center gap-1.5">
                      {selectedChoice === currentQ.correctIndex ? (
                        <span className="text-emerald-400">✓ Correct Assessment</span>
                      ) : (
                        <span className="text-red-400">✗ Incorrect Assessment</span>
                      )}
                    </div>
                    <p className="text-steel-200 mt-1">{currentQ.explanation}</p>
                  </div>
                )}

              </div>

            </div>
          ) : (
            /* COMPLETION & CERTIFICATE VIEW */
            <div className="space-y-8">
              
              {/* Score Summary Card */}
              <div className="p-8 rounded-lg bg-charcoal-850 border border-steel-800 text-center space-y-4 shadow-2xl">
                <div className="w-16 h-16 rounded-full bg-furnace-flame/20 text-furnace-amber mx-auto flex items-center justify-center">
                  <Icons.Quiz />
                </div>
                <h2 className="font-display text-3xl font-bold uppercase text-white">
                  Metallurgical Assessment Complete
                </h2>
                <div className="font-mono text-5xl font-extrabold text-white">
                  {score} <span className="text-2xl text-steel-500 font-normal">/ {questions.length}</span>
                </div>
                <div className={`font-mono text-sm uppercase tracking-wider font-bold ${tierColor}`}>
                  Attained Rating: {tier} ({percentage}%)
                </div>
                <p className="text-xs text-steel-400 max-w-md mx-auto leading-relaxed">
                  {percentage >= 70
                    ? 'Outstanding! You have demonstrated comprehensive understanding of steel thermal kinetics, phase transformations, and microstructure control.'
                    : 'Good attempt. Review the scientific references and glossary to master the thermodynamics of austenitizing and quench media.'}
                </p>

                <div className="pt-4 flex flex-wrap justify-center gap-4">
                  <button
                    type="button"
                    onClick={initQuiz}
                    className="px-6 py-2.5 rounded bg-charcoal-800 border border-steel-700 text-steel-200 text-xs font-mono hover:text-white hover:bg-steel-750 transition-colors flex items-center gap-1"
                  >
                    <Icons.RotateCcw /> Retake Quiz (New Question Draw)
                  </button>
                  <button
                    type="button"
                    onClick={() => window.print()}
                    className="px-6 py-2.5 rounded bg-furnace-amber text-charcoal-950 font-bold text-xs uppercase tracking-wider hover:brightness-110 transition-colors"
                  >
                    Print Official Certificate
                  </button>
                </div>
              </div>

              {/* Printable Certificate Template */}
              <div id="certificate-modal" className="p-8 sm:p-12 rounded-xl bg-charcoal-950 border-4 border-steel-750 relative overflow-hidden shadow-2xl text-center space-y-6">
                <div className="absolute inset-0 bg-grid-pattern opacity-10 pointer-events-none" />
                
                <div className="border-b border-steel-800 pb-4">
                  <div className="font-mono text-xs uppercase tracking-widest text-furnace-gold font-bold mb-1">
                    CERTIFICATE OF COMPETENCY

<!-- ROUTER + APP -->
  <script type="text/babel">
    /**
     * Custom Hash Router & Root Application Component
     */
    function App() {
      // Initialize route from window.location.hash or fallback to #/home
      const [currentRoute, setCurrentRoute] = React.useState(() => {
        const hash = window.location.hash;
        return hash || '#/home';
      });

      // Hash change listener with scroll-to-top behavior
      React.useEffect(() => {
        function handleHashChange() {
          const newHash = window.location.hash || '#/home';
          setCurrentRoute(newHash);
          // Accessible scroll-to-top on route navigation
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // If no hash present, set to #/home without adding history entry
        if (!window.location.hash) {
          window.location.replace('#/home');
        }

        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      // Route View Dispatcher
      function renderActivePage() {
        switch (currentRoute) {
          case '#/home':
          case '':
            return <HomePage />;
          case '#/simulator':
            return <SimulatorPage />;
          case '#/processes':
            return <ProcessesPage />;
          case '#/microstructure':
            return <MicrostructurePage />;
          case '#/compare':
            return <ComparePage />;
          case '#/quiz':
            return <QuizPage />;
          case '#/about':
            return <AboutPage />;
          default:
            return <NotFoundPage />;
        }
      }

      return (
        <div className="flex flex-col min-h-screen">
          <Navbar currentRoute={currentRoute} />
          
          <main id="main-content" className="flex-grow focus:outline-none" tabIndex={-1}>
            {renderActivePage()}
          </main>

          <Footer />
        </div>
      );
    }

    // Mount the React Application
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
